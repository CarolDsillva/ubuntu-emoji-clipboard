name: Build & test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="0.0.0~git${GITHUB_SHA::7}"; fi
          bash packaging/build-deb.sh "$VERSION"
          cp dist/clipboard-picker_*_all.deb dist/clipboard-picker_all.deb

      - name: Check installer scripts
        run: bash -n install.sh uninstall.sh packaging/*.sh && python3 -m py_compile clipboard_picker.py emoji_data.py

      - name: Lint package (informational)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian >/dev/null
          lintian --info dist/clipboard-picker_all.deb || true

      - name: Install package
        run: |
          sudo apt-get install -y ./dist/clipboard-picker_all.deb \
            xvfb xauth xclip imagemagick dbus dbus-x11 dconf-gsettings-backend dconf-service \
            gnome-settings-daemon-common ibus
          dpkg -L clipboard-picker

      - name: Smoke test (virtual display)
        run: bash packaging/smoke-test.sh dist/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-picker
          path: |
            dist/clipboard-picker_all.deb
            dist/screenshots/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clipboard-picker_all.deb
          generate_release_notes: true
